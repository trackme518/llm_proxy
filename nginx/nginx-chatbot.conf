# this is CORS 
map $http_origin $cors_origin {
  default "";
  "~^https://srv1209047\.hstgr\.cloud$" $http_origin;
  "~^https://muzeumprahy\.cz$" $http_origin;
  "~^https://www\.muzeumprahy\.cz$" $http_origin;
  "~^https://([a-z0-9-]+\.)*muzeumprahy\.cz$" $http_origin;
  "~^https://museumofpragueai\.com$" $http_origin;
  "~^https://([a-z0-9-]+\.)*museumofpragueai\.com$" $http_origin;
  "~^https://museumofprague\.com$" $http_origin;
  "~^https://test\.web02-aitom\.cz$" $http_origin;
  "~^http://localhost(:[0-9]+)?$" $http_origin;
  "~^http://127.0.0.1(:[0-9]+)?$" $http_origin;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      add_header Access-Control-Max-Age "86400" always;
      add_header Vary "Origin" always;
      return 204;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Vary "Origin" always;

    # Canonicalize directory URLs so relative assets resolve from the folder.
    if (-d $request_filename) {
      rewrite ^(.+[^/])$ /client$1/ permanent;
    }

    try_files $uri $uri/index.html /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  # this is allowed embeds / iframes
  add_header Content-Security-Policy "frame-ancestors 'self'
    https://srv1209047.hstgr.cloud
    https://muzeumprahy.cz
    https://www.muzeumprahy.cz
    https://*.muzeumprahy.cz
    https://museumofpragueai.com
    https://*.museumofpragueai.com
    https://museumofprague.com
    http://localhost
    http://127.0.0.1
    https://test.web02-aitom.cz;" always;
}
